[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sign-language-recognition"
version = "1.0.0"
description = "Webcam sign recognition using hand landmarks and a CNN-LSTM classifier"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.26,<2.0",
    "opencv-python>=4.8",
    "mediapipe>=0.10.9,<0.10.22",
    "tensorflow>=2.15,<2.19",
    "scikit-learn>=1.3,<2.0",
]

[project.scripts]
sign-collect = "sign_language.collect:main"
sign-train = "sign_language.train:main"
sign-predict = "sign_language.predict:main"

[tool.setuptools.packages.find]
where = ["src"]
